<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      var redirectTo = '/CentralBankWebApp/index.html' + location.search;
      var path = location.pathname.replace('/CentralBankWebApp', '');
      if (path && path !== '/index.html') {
        redirectTo += (location.search ? '&' : '?') + 'path=' + encodeURIComponent(path);
      }
      redirectTo += location.hash;
      window.location.replace(redirectTo);
    </script>
</head>
<body>
</body>
</html>
